<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Kadras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Rubik:wght@400;600;700&display=swap">
<style>
:root{--bg:#141412;--fg:#F4F1E8;--acc:#FFE34F;--mut:#BDB8A6;--card:#26251F;--red:#FF5268}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:Rubik,Arial,sans-serif;font-size:20px;line-height:1.35;-webkit-text-size-adjust:100%}
h1,h2,.num{font-family:Oswald,"Arial Narrow",Arial,sans-serif;font-weight:700;text-transform:uppercase;line-height:1.1}
button,input,textarea{font:inherit;color:inherit}
img{display:block;max-width:100%}
.hid{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.badge{position:fixed;top:8px;right:8px;z-index:9;background:var(--red);color:#fff;font-size:13px;font-weight:700;padding:3px 8px;border-radius:6px}

/* участник */
.guest{max-width:560px;margin:0 auto;padding:20px 20px 40px;min-height:100%;display:flex;flex-direction:column;gap:20px}
.guest h1{font-size:40px}
.guest h2{font-size:30px}
.kicker{color:var(--acc);font-size:15px;font-weight:600;letter-spacing:2px;text-transform:uppercase}
.task{background:var(--card);border-left:6px solid var(--acc);border-radius:12px;padding:16px 18px;font-size:22px}
.mut{color:var(--mut)}
.small{font-size:16px}
.err{background:var(--red);color:#fff;border-radius:12px;padding:14px 16px;font-weight:600}
label.f{display:flex;flex-direction:column;gap:8px;font-size:18px;color:var(--mut)}
input.t{background:#fff;color:#141412;border:0;border-radius:14px;padding:16px 18px;font-size:24px;width:100%}
.btn{display:flex;align-items:center;justify-content:center;text-align:center;gap:10px;width:100%;min-height:76px;padding:14px 20px;border:0;border-radius:18px;background:var(--acc);color:#141412;font-size:26px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn.big{min-height:140px;font-size:34px}
.btn.ghost{background:transparent;color:var(--fg);border:2px solid var(--mut);min-height:60px;font-size:20px;font-weight:600}
.btn[disabled]{background:#4a483e;color:#BDB8A6;cursor:default}
.shot{width:100%;border-radius:14px;background:#000;max-height:56vh;object-fit:contain}
.ok{font-size:28px;font-weight:700;color:var(--acc)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cell{position:relative;border-radius:12px;overflow:hidden;background:#000;border:4px solid transparent;aspect-ratio:1/1;cursor:pointer}
.cell img{width:100%;height:100%;object-fit:contain}
.cell .n{position:absolute;left:6px;top:6px;background:var(--acc);color:#141412;font-family:Oswald,Arial,sans-serif;font-weight:700;font-size:22px;min-width:38px;text-align:center;padding:2px 8px;border-radius:8px}
.cell.sel{border-color:var(--acc);grid-column:span 2}
.cell.own{opacity:.55}
.cell .tag{position:absolute;left:0;right:0;bottom:0;background:rgba(20,20,18,.85);font-size:14px;padding:4px 6px;text-align:center}
.stick{position:sticky;bottom:12px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:12px;padding:8px}
.row img{width:72px;height:72px;object-fit:cover;border-radius:8px;flex:none}
.row .num{font-size:28px;color:var(--acc);min-width:44px;text-align:center}
.row .bar{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.row .bar i{display:block;height:12px;border-radius:6px;background:var(--acc);min-width:4px}
.row.me{outline:3px solid var(--acc)}
.guest .win{background:var(--acc);color:#141412;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.guest .win img{border-radius:10px;background:#000;max-height:50vh;object-fit:contain;width:100%}

/* экран */
.screen{height:100vh;display:flex;flex-direction:column;padding:2.2vw;gap:1.6vw;overflow:hidden}
.screen header{display:flex;justify-content:space-between;align-items:flex-end;gap:2vw}
.screen h1{font-size:3.6vw}
.screen .kicker{font-size:1.3vw}
.screen .cnt{font-family:Oswald,Arial,sans-serif;font-weight:700;font-size:3vw;color:var(--acc);white-space:nowrap}
.screen .body{flex:1;display:flex;gap:2vw;min-height:0}
.join{flex:none;width:24vw;display:flex;flex-direction:column;gap:1vw;align-items:center;justify-content:center;text-align:center}
.join.full{width:100%;flex-direction:row;gap:5vw;text-align:left}
.qr{background:#fff;border-radius:1vw;padding:1vw;width:100%;aspect-ratio:1/1}
.join.full .qr{width:34vw}
.qr svg{width:100%;height:100%;display:block}
.join .adr{font-size:1.4vw;font-weight:700;overflow-wrap:anywhere}
.join.full .adr{font-size:2.4vw}
.steps{display:flex;flex-direction:column;gap:1.2vw;font-size:2.6vw}
.steps b{color:var(--acc);font-family:Oswald,Arial,sans-serif;font-size:3.4vw;margin-right:1vw}
.wall{flex:1;display:grid;gap:.8vw;min-width:0;min-height:0;align-content:center}
.tile{position:relative;background:#000;border-radius:.6vw;overflow:hidden;min-height:0}
.tile img{width:100%;height:100%;object-fit:contain}
.tile .n{position:absolute;left:.4vw;top:.4vw;background:var(--acc);color:#141412;font-family:Oswald,Arial,sans-serif;font-weight:700;font-size:1.8vw;padding:0 .7vw;border-radius:.4vw}
.tile .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(20,20,18,.88);padding:.4vw .6vw;font-size:1.3vw;display:flex;justify-content:space-between;gap:.6vw;align-items:center}
.tile .cap b{color:var(--acc);font-family:Oswald,Arial,sans-serif;font-size:1.8vw}
.tile .vb{position:absolute;left:0;bottom:0;height:.5vw;background:var(--acc)}
.tile.win{outline:.5vw solid var(--acc);outline-offset:-.5vw}

/* пульт */
.host{max-width:900px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:16px;font-size:17px}
.host h1{font-size:26px}
.host .box{background:var(--card);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.host .line{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.host button{background:#3a382f;border:0;border-radius:10px;padding:12px 14px;font-size:17px;font-weight:600;cursor:pointer}
.host button.on{background:var(--acc);color:#141412}
.host button.red{background:var(--red);color:#fff}
.host input,.host textarea{background:#fff;color:#141412;border:0;border-radius:10px;padding:10px 12px;font-size:17px;width:100%}
.host .ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.host .p{background:#1c1b17;border-radius:10px;overflow:hidden;font-size:14px}
.host .p img{width:100%;aspect-ratio:1/1;object-fit:cover}
.host .p div{padding:6px 8px}
.host .p.off img{opacity:.25}
.host a{color:var(--acc)}
.popts{display:grid;gap:10px;margin:8px 0 90px}
.popt{box-sizing:border-box;width:100%;min-height:58px;padding:10px 16px;border:2px solid #4a483e;border-radius:14px;background:transparent;color:var(--fg);font-size:21px;font-weight:600;text-align:left;cursor:pointer}
.popt.on{background:var(--acc);color:#141412;border-color:var(--acc)}
.pbars{display:grid;gap:8px;margin:10px 0}
.prow{position:relative;display:flex;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:12px;background:#2a2822;overflow:hidden;font-size:18px}
.prow span,.prow b{position:relative;z-index:1}.prow i{position:absolute;left:0;top:0;bottom:0;background:#FFE34F33;transition:width .6s}
.prow.me{outline:2px solid var(--acc)}
.pollscr{display:flex;gap:3vw;align-items:center}.pbars.big{flex:1;gap:1.1vh}.pbars.big .prow{font-size:2.6vh;padding:1vh 1.4vw}
.pbars.big .prow i{background:#FFE34F66}
.tile.pop{animation:kd_pop .7s cubic-bezier(.2,1.5,.4,1) both}
@keyframes kd_pop{from{transform:scale(.3) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
.cap.duel{background:#C0392B!important;color:#fff!important;font-size:3vh!important}
.dwrap{position:relative;border-radius:16px;overflow:hidden;background:#000;margin:8px 0}
.dwrap video{display:block;width:100%;max-height:62vh;object-fit:cover}
.dcount{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:900 30vw/1 Oswald,Arial,sans-serif;color:#FFE34F;text-shadow:0 4px 30px #000}
.dflash{position:absolute;inset:0;background:#fff;opacity:0;transition:opacity .25s;pointer-events:none}
.dov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font:900 60vh/1 Oswald,Arial,sans-serif;color:#FFE34F;background:#000a;z-index:50;text-shadow:0 6px 40px #000}
.dov.flash{background:#fff;color:#C0392B;font-size:40vh}
.cell .heart{position:absolute;right:8px;bottom:8px;font-size:30px;filter:drop-shadow(0 2px 4px #000)}
</style>
</head>
<body>
<div id="app"></div>
<script src="config.js"></script>
<script src="api.js"></script>
<script src="dalyvis.js"></script>
<script src="ekranas.js"></script>
<script src="pultas.js"></script>
</body>
</html>
